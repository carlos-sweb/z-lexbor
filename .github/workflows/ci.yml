name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Inline unit tests
        run: zig build test-unit --summary all
      - name: Full suite (integration, adversarial, fuzz, OOM injection)
        run: zig build test-suite --summary all
      - name: Public API coverage gate
        run: zig build check-coverage
      - name: Build examples
        run: zig build
      - name: Run examples
        run: |
          ./zig-out/bin/parse
          ./zig-out/bin/query

  release-safe:
    name: full suite under ReleaseSafe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Safety checks stay on, so this exercises a different optimisation path
      # than Debug and can surface undefined behaviour in the C interop layer.
      - name: Full test suite
        run: zig build test --summary all -Doptimize=ReleaseSafe

  cross:
    name: cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-gnu
          - target: x86_64-windows-gnu
          - target: wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build for ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} --summary all

  macos:
    name: native macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test --summary all
      - run: zig build check-coverage

  consumer:
    name: external consumer integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Verify a standalone project can depend on z-lexbor
        run: ./tools/check-consumer.sh

  hermetic:
    name: no system lexbor present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Fail if the build reaches outside the vendored tree
        run: |
          test ! -d /usr/local/include/lexbor
          zig build test --summary all
